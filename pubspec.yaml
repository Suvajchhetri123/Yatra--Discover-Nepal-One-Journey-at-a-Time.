name: yatra
description: "Yatra - A Nepal travel planning and recommendation application."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/places/
    - assets/images/yatra_logo.jpeg

flutter_launcher_icons:
  andriod: true
  ios: true
  image_path: "assets/images/yatra_app_icon.png"
  min_sdk_andriod: 21
